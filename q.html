<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授权跳转 · Stone Logic</title>
<link rel="icon" href="assets/icon.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1c2c;color:#b8e4ff;
       font:14px/1.7 "PingFang SC","Microsoft YaHei",Arial,sans-serif}
  .box{text-align:center;padding:24px}
  a{color:#7dd3fc}
</style>
</head>
<body>
<div class="box">
  <p>正在打开授权页…</p>
  <p><a id="manual" href="index.html">没有自动跳转？点这里</a></p>
</div>
<script>
/* 游戏内二维码用的短跳转：把 c / l 还原成 confirm.html 的 c / lt。
   只为把二维码从 37x37 压到 33x33，好让文本方格塞得进 dialog。 */
(function () {
  var q = new URLSearchParams(location.search);
  var c = q.get('c') || '';
  var l = q.get('l') || '';
  var t = q.get('topic') || '';
  var url = 'confirm.html?c=' + encodeURIComponent(c) + '&lt=' + encodeURIComponent(l) +
            (t ? '&topic=' + encodeURIComponent(t) : '');
  document.getElementById('manual').href = url;
  location.replace(url);
})();
</script>
</body>
</html>

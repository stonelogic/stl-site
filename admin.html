<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>管理后台 · Stone Logic</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .ad-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px clamp(14px,4vw,32px);background:var(--card);border-bottom:1px solid var(--border)}
  .ad-brand{font-weight:800;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
  .ad-brand span{font-size:12px;font-weight:600;color:var(--muted-foreground);padding:3px 8px;border-radius:999px;background:var(--muted)}
  .ad-spacer{flex:1}
  .ad-main{max-width:1180px;margin:0 auto;padding:22px clamp(14px,4vw,32px) 60px}
  .ad-gate{max-width:520px;margin:8vh auto;padding:28px}
  .ad-gate h1{margin:0 0 6px;font-size:20px}
  .ad-gate p{margin:0 0 18px;font-size:13px;color:var(--muted-foreground);line-height:1.7}
  .ad-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ad-input{flex:1;min-width:220px;padding:10px 12px;border-radius:9px;border:1px solid var(--input);
    background:var(--card);color:var(--foreground);font-size:13px;font-family:var(--font-sans)}
  .ad-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:20px}
  .ad-card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius)*1.3);padding:15px 16px}
  .ad-card .k{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
  .ad-card .v{font-size:23px;font-weight:800;margin-top:7px;line-height:1.2}
  .ad-card .s{font-size:12px;color:var(--muted-foreground);margin-top:5px}
  .ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  @media(max-width:820px){.ad-grid{grid-template-columns:1fr}}
  .ad-panel{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius)*1.4);padding:18px}
  .ad-panel h2{margin:0 0 14px;font-size:15px;font-weight:750;display:flex;align-items:center;gap:8px}
  .ad-panel h2 small{font-size:12px;font-weight:500;color:var(--muted-foreground)}
  .ad-canvas{width:100%;height:112px;display:block}
  .ad-legend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);margin-top:8px;flex-wrap:wrap}
  .ad-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .ad-ports{display:flex;gap:10px;flex-wrap:wrap}
  .ad-port{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:9px;
    border:1px solid var(--border);background:var(--background)}
  .ad-table{width:100%;border-collapse:collapse;font-size:13px}
  .ad-table th{text-align:left;font-size:12px;font-weight:600;color:var(--muted-foreground);
    padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  .ad-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  .ad-table tr:last-child td{border-bottom:0}
  .ad-table tbody tr:hover{background:var(--accent)}
  .ad-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
  .ad-empty{padding:26px;text-align:center;color:var(--muted-foreground);font-size:13px}
  .ad-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--muted);
    color:var(--muted-foreground);white-space:nowrap;display:inline-block}
  .ad-tag.ok{background:oklch(93% .06 150);color:oklch(42% .12 150)}
  .ad-tag.bad{background:oklch(93% .06 27);color:oklch(48% .18 27)}
  [data-theme="dark"] .ad-tag.ok{background:oklch(30% .06 150);color:oklch(85% .1 150)}
  [data-theme="dark"] .ad-tag.bad{background:oklch(30% .06 27);color:oklch(85% .1 27)}
  .ad-scroll{max-height:420px;overflow:auto}
  .ad-status{font-size:12px;color:var(--muted-foreground)}
  .ad-err{color:var(--destructive);font-size:13px;margin-top:12px}
</style>
</head>
<body>

<header class="ad-top">
  <div class="ad-brand">管理后台 <span id="verTag">本地服务</span></div>
  <div class="ad-spacer"></div>
  <div class="ad-status" id="statusText">未连接</div>
  <button class="btn btn-outline" id="btnRefresh" type="button">刷新</button>
  <button class="btn btn-ghost" id="btnLogout" type="button">断开</button>
</header>

<main class="ad-main">

  <!-- 未连接：输入管理口令 -->
  <section class="card ad-gate" id="gate">
    <h1>管理员登录</h1>
    <p>这个页面由服务器本机的管理服务提供，需要管理口令（config.json 里的 adminToken）。口令只保存在本机浏览器，不会上传到任何第三方。</p>
    <div class="ad-row">
      <input class="ad-input" id="tokenInput" type="password" placeholder="粘贴管理口令…" autocomplete="off">
      <button class="btn btn-primary" id="btnConnect" type="button">连接</button>
    </div>
    <div class="ad-err" id="gateErr" hidden></div>
  </section>

  <!-- 已连接：数据面板 -->
  <div id="panel" hidden>
    <div class="ad-cards" id="cards"></div>

    <div class="ad-grid">
      <div class="ad-panel">
        <h2>内存在用 <small>RSS，单位 MB</small></h2>
        <canvas class="ad-canvas" id="cvMem"></canvas>
        <div class="ad-legend"><span><i class="ad-dot" style="background:var(--primary)"></i><span id="memNow">—</span></span>
          <span>阈值 <b id="memLimit">—</b> MB</span></div>
      </div>
      <div class="ad-panel">
        <h2>在线人数 <small>来自官方在线数据</small></h2>
        <canvas class="ad-canvas" id="cvOnline"></canvas>
        <div class="ad-legend"><span><i class="ad-dot" style="background:oklch(65% .15 150)"></i>当前 <b id="onlineNow">—</b> 人</span>
          <span id="onlineAge">—</span></div>
      </div>
    </div>

    <div class="ad-grid">
      <div class="ad-panel">
        <h2>服务端口</h2>
        <div class="ad-ports" id="ports"></div>
        <div class="ad-legend" style="margin-top:12px">
          <span>进程运行 <b id="uptime">—</b></span>
          <span>请求 <b id="rpm">—</b> 次/分</span>
        </div>
      </div>
      <div class="ad-panel">
        <h2>最近告警 <small>最多 30 条</small></h2>
        <div class="ad-scroll" style="max-height:180px">
          <table class="ad-table"><tbody id="alarmRows"></tbody></table>
        </div>
      </div>
    </div>

    <div class="ad-panel" style="margin-bottom:18px">
      <h2>活跃授权 <small>游戏内登录态，到期自动失效</small></h2>
      <div class="ad-scroll">
        <table class="ad-table">
          <thead><tr><th>游戏 ID</th><th>QQ</th><th>绑定账号</th><th>剩余</th></tr></thead>
          <tbody id="authRows"></tbody>
        </table>
      </div>
    </div>

    <div class="ad-grid">
      <div class="ad-panel">
        <h2>举报队列 <small id="reportCount"></small></h2>
        <div class="ad-scroll">
          <table class="ad-table">
            <thead><tr><th>时间</th><th>帖子</th><th>举报人</th><th>原因</th></tr></thead>
            <tbody id="reportRows"></tbody>
          </table>
        </div>
      </div>
      <div class="ad-panel">
        <h2>审计日志 <small id="auditCount"></small></h2>
        <div class="ad-scroll">
          <table class="ad-table">
            <thead><tr><th>时间</th><th>动作</th><th>账号</th><th>目标</th></tr></thead>
            <tbody id="auditRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'stl_admin_token_v1';
  var timer = null;
  var last = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtTime(ms) {
    var n = Number(ms) || 0;
    if (!n) return '—';
    var d = new Date(n);
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    if (d) return d + ' 天 ' + h + ' 小时';
    if (h) return h + ' 小时 ' + m + ' 分';
    return m + ' 分';
  }

  /* 简单折线图：自适应宽度，画区间 + 折线 + 末点 */
  function draw(canvas, values, color) {
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var vals = (values || []).filter(function (v) { return typeof v === 'number' && isFinite(v); });
    if (vals.length < 2) {
      ctx.fillStyle = 'rgba(128,128,128,.45)';
      ctx.font = '12px sans-serif';
      ctx.fillText('数据还不够，运行几分钟后再看', 8, h / 2 + 4);
      return;
    }
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    if (max === min) { max = min + 1; }
    var pad = 8;
    var stepX = (w - pad * 2) / (vals.length - 1);
    function y(v) { return h - pad - (v - min) / (max - min) * (h - pad * 2); }

    // 网格
    ctx.strokeStyle = 'rgba(128,128,128,.18)';
    ctx.lineWidth = 1;
    for (var g = 0; g <= 2; g++) {
      var yy = pad + (h - pad * 2) * g / 2;
      ctx.beginPath(); ctx.moveTo(pad, yy); ctx.lineTo(w - pad, yy); ctx.stroke();
    }
    // 面积
    ctx.beginPath();
    ctx.moveTo(pad, y(vals[0]));
    for (var i = 1; i < vals.length; i++) ctx.lineTo(pad + stepX * i, y(vals[i]));
    ctx.lineTo(w - pad, h - pad); ctx.lineTo(pad, h - pad); ctx.closePath();
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, color.replace('ALPHA', '.25'));
    grad.addColorStop(1, color.replace('ALPHA', '.02'));
    ctx.fillStyle = grad; ctx.fill();
    // 折线
    ctx.beginPath();
    ctx.moveTo(pad, y(vals[0]));
    for (var j = 1; j < vals.length; j++) ctx.lineTo(pad + stepX * j, y(vals[j]));
    ctx.strokeStyle = color.replace('ALPHA', '1');
    ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    // 末点
    ctx.beginPath();
    ctx.arc(w - pad, y(vals[vals.length - 1]), 3, 0, Math.PI * 2);
    ctx.fillStyle = color.replace('ALPHA', '1'); ctx.fill();

    // 顶端数值
    ctx.fillStyle = 'rgba(128,128,128,.75)';
    ctx.font = '11px sans-serif';
    ctx.fillText(Math.round(max), pad, pad + 10);
  }

  function setStatus(t) { $('statusText').textContent = t; }

  function render(d) {
    last = d;
    var m = d.monitor || {};
    var mx = m.metrics || {};
    var on = m.online || {};

    /* ---- 顶部指标卡 ---- */
    var cards = [
      { k: '在线人数', v: (on.now != null ? on.now : '—') + ' 人', s: on.stale ? '数据可能已断流' : ('上限 ' + (on.max || '—')) },
      { k: '内存在用', v: (mx.rssMb != null ? mx.rssMb : '—') + ' MB', s: '堆 ' + (mx.heapMb != null ? mx.heapMb : '—') + ' MB' },
      { k: '进程运行', v: mx.uptimeText || '—', s: '每 60 秒采集' },
      { k: '请求速率', v: (mx.reqPerMin != null ? mx.reqPerMin : '—') + ' 次/分', s: '本次统计窗口' },
      { k: '登录凭证', v: (d.counts && d.counts.tokens != null ? d.counts.tokens : '—') + ' 条', s: '含所有设备' },
      { k: '活跃授权', v: (d.counts && d.counts.activeAuth != null ? d.counts.activeAuth : '—') + ' 个', s: '游戏内登录态' },
      { k: '待看举报', v: (d.counts && d.counts.reports != null ? d.counts.reports : '—') + ' 条', s: '日志全量' },
      { k: '审计记录', v: (d.counts && d.counts.audit != null ? d.counts.audit : '—') + ' 条', s: '最近拉取' }
    ];
    $('cards').innerHTML = cards.map(function (c) {
      return '<div class="ad-card"><div class="k">' + esc(c.k) + '</div><div class="v">' + esc(c.v) + '</div><div class="s">' + esc(c.s) + '</div></div>';
    }).join('');

    /* ---- 曲线 ---- */
    var trends = Array.isArray(d.trends) ? d.trends : [];
    draw($('cvMem'), trends.map(function (t) { return Number(t.rss); }), 'rgba(59,130,246,ALPHA)');
    draw($('cvOnline'), trends.map(function (t) { return Number(t.online); }), 'rgba(16,185,129,ALPHA)');
    $('memNow').textContent = (mx.rssMb != null ? mx.rssMb + ' MB' : '—');
    $('memLimit').textContent = (m.thresholds && m.thresholds.rssAlertMb) || '—';
    $('onlineNow').textContent = (on.now != null ? on.now : '—');
    $('onlineAge').textContent = on.ageSec >= 0 ? ('数据 ' + (on.ageSec < 90 ? on.ageSec + ' 秒前' : Math.round(on.ageSec / 60) + ' 分钟前') + '更新') : '暂无数据';

    /* ---- 端口 ---- */
    var servers = Array.isArray(m.servers) ? m.servers : [];
    $('ports').innerHTML = servers.length ? servers.map(function (s) {
      return '<div class="ad-port"><span class="ad-tag ' + (s.up ? 'ok' : 'bad') + '">' +
        (s.up ? '在线' : '无响应') + '</span>' + esc(s.name) + ' <span class="ad-mono">:' + s.port + '</span></div>';
    }).join('') : '<div class="ad-empty">没有配置要监控的端口</div>';
    $('uptime').textContent = mx.uptimeText || '—';
    $('rpm').textContent = (mx.reqPerMin != null ? mx.reqPerMin : '—');

    /* ---- 告警 ---- */
    var alarms = Array.isArray(d.alarms) ? d.alarms : [];
    $('alarmRows').innerHTML = alarms.length ? alarms.map(function (a) {
      return '<tr><td class="ad-mono" style="white-space:nowrap">' + fmtTime(a.t) + '</td>' +
        '<td><span class="ad-tag ' + (a.kind === 'recover' ? 'ok' : 'bad') + '">' +
        (a.kind === 'recover' ? '恢复' : '异常') + '</span></td>' +
        '<td>' + esc(a.text) + '</td></tr>';
    }).join('') : '<tr><td class="ad-empty">最近没有告警，一切正常</td></tr>';

    /* ---- 活跃授权 ---- */
    var auth = Array.isArray(d.activeAuth) ? d.activeAuth : [];
    $('authRows').innerHTML = auth.length ? auth.map(function (a) {
      return '<tr><td>' + esc(a.player) + '</td><td class="ad-mono">' + esc(a.qq || '—') + '</td>' +
        '<td>' + (a.names && a.names.length ? esc(a.names.join('、')) : '—') + '</td>' +
        '<td>' + a.remainMin + ' 分钟</td></tr>';
    }).join('') : '<tr><td colspan="4" class="ad-empty">当前没有游戏内授权</td></tr>';

    /* ---- 举报 ---- */
    var reports = Array.isArray(d.reports) ? d.reports : [];
    $('reportCount').textContent = reports.length ? ('共 ' + reports.length + ' 条') : '';
    $('reportRows').innerHTML = reports.length ? reports.map(function (r) {
      return '<tr><td class="ad-mono" style="white-space:nowrap">' + fmtTime(r.t) + '</td>' +
        '<td class="ad-mono">' + esc(r.post_id) + '</td>' +
        '<td class="ad-mono">' + esc(r.qq || '—') + '</td>' +
        '<td>' + esc(r.reason || '') + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="ad-empty">没有待处理的举报</td></tr>';

    /* ---- 审计 ---- */
    var audit = Array.isArray(d.audit) ? d.audit : [];
    var ACT = {
      forum_post: '发帖', forum_reply: '回复', forum_edit: '编辑帖子',
      forum_del: '删除帖子', forum_report: '举报'
    };
    $('auditCount').textContent = audit.length ? ('共 ' + audit.length + ' 条') : '';
    $('auditRows').innerHTML = audit.length ? audit.map(function (a) {
      var who = (a.names && a.names.length ? a.names[0] : '') || ('QQ' + (a.qq || '?'));
      var target = a.extra && a.extra.id ? a.extra.id : '—';
      return '<tr><td class="ad-mono" style="white-space:nowrap">' + fmtTime(a.t) + '</td>' +
        '<td><span class="ad-tag">' + esc(ACT[a.action] || a.action) + '</span></td>' +
        '<td>' + esc(who) + '</td>' +
        '<td class="ad-mono">' + esc(target) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="ad-empty">还没有操作记录</td></tr>';

    setStatus('已连接 · 更新于 ' + fmtTime(d.serverTime));
  }

  function fetchData() {
    var token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) return;
    fetch('api/admin/overview?limit=120&token=' + encodeURIComponent(token), { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 403) throw new Error('管理口令不正确');
        if (!r.ok) throw new Error('接口返回 ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error) || '数据异常');
        render(d);
        $('gate').hidden = true;
        $('panel').hidden = false;
      })
      .catch(function (e) {
        setStatus('连接失败');
        if (!last) {
          $('gate').hidden = false;
          $('panel').hidden = true;
          var ge = $('gateErr');
          ge.hidden = false;
          ge.textContent = /Failed to fetch|NetworkError/.test(e.message)
            ? '连不上本地服务。请确认管理服务在运行，并通过 http://127.0.0.1:28080/admin.html 打开本页。'
            : e.message;
        }
      });
  }

  function start() {
    stop();
    fetchData();
    timer = setInterval(fetchData, 30000);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  $('btnConnect').addEventListener('click', function () {
    var v = ($('tokenInput').value || '').trim();
    if (!v) { $('gateErr').hidden = false; $('gateErr').textContent = '请先填写管理口令'; return; }
    localStorage.setItem(TOKEN_KEY, v);
    $('gateErr').hidden = true;
    start();
  });
  $('tokenInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('btnConnect').click();
  });
  $('btnRefresh').addEventListener('click', fetchData);
  $('btnLogout').addEventListener('click', function () {
    stop();
    localStorage.removeItem(TOKEN_KEY);
    last = null;
    $('tokenInput').value = '';
    $('panel').hidden = true;
    $('gate').hidden = false;
    setStatus('未连接');
  });

  /* 首次加载：有口令就直接连，否则显示登录框 */
  if (localStorage.getItem(TOKEN_KEY)) start();
  window.addEventListener('resize', function () {
    if (last) render(last);
  });
})();
</script>
</body>
</html>

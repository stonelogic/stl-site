<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Stone Logic 服务器官方站点：服务器状态、玩家皮肤查询、新手指南、服务器规则、封禁申诉。">
<title>Stone Logic 服务器</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
  <link rel="preload" as="font" href="assets/fonts/silkscreen-700.woff2" type="font/woff2" crossorigin>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <img class="brand-icon" src="assets/icon.png" alt="logo">
      <span class="brand-name stl-pixel">Stone Logic</span>
    </a>
    <nav class="nav-main" id="navMain"></nav>
    <div class="nav-right">
      <button class="icon-btn" id="searchBtn" title="全站搜索（Ctrl/⌘ + K）" aria-label="全站搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" title="切换深色/浅色模式" aria-label="切换主题">
        <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="nav-actions" id="navActions"></div>
    </div>
  </div>
</header>

<!-- ===== 主内容 ===== -->
<main class="main" id="main"></main>

<footer class="footer">
  <div class="footer-inner footer-cols">
    <div class="footer-brand">
      <div class="fb-name stl-pixel" id="footerName">Stone Logic 服务器</div>
      <p class="fb-tag">生存 | 小游戏 | 与朋友一起探索无限可能</p>
      <div class="fb-ip" id="footerIp">frp-top.com:44558</div>
    </div>
    <div class="footer-col">
      <div class="fc-title">快速链接</div>
      <a href="#/guide">新手指南</a>
      <a href="#/online">在线状态</a>
      <a href="#/rank">在线时长</a>
      <a href="#/weekly">本周战报</a>
      <a href="#/events">活动日历</a>
      <a href="#/health">服务器体检</a>
      <a href="#/rules">服务器规则</a>
    </div>
    <div class="footer-col">
      <div class="fc-title">联系我们</div>
      <a id="footerQq" href="https://qm.qq.com/q/UhSK4yuLGG" target="_blank" rel="noopener">QQ 群 ↗</a>
      <span>MC 版本 1.21.X</span>
      <span>正版 / 离线均可</span>
    </div>
  </div>
  <div class="footer-copy">© <span id="footerYear"></span> Stone Logic · 玩家自制服务器，与 Mojang / Microsoft 无隶属关系</div>
</footer>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<div class="toast" id="toast"></div>

<!-- ===== 全站搜索（Ctrl/⌘ + K） ===== -->
<div class="sbox" id="sbox" hidden>
  <div class="sbox-mask" id="sboxMask"></div>
  <div class="sbox-panel" role="dialog" aria-modal="true" aria-label="全站搜索">
    <div class="sbox-head">
      <svg class="sbox-ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="sboxInput" type="text" placeholder="搜玩家、帖子、Wiki、公告…" autocomplete="off" spellcheck="false">
      <kbd class="sbox-kbd">ESC</kbd>
    </div>
    <div class="sbox-body" id="sboxBody"></div>
    <div class="sbox-foot"><span id="sboxHint">输入关键词开始搜</span><span>Ctrl/⌘ + K 随时打开</span></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/authbar.js"></script>
<script src="assets/editor.js"></script>
</body>
</html>

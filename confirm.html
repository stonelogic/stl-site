<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号登录 · Stone Logic</title>
<style>
  :root{
    --background: oklch(100% 0 0); --foreground: oklch(14.5% 0 0);
    --card: oklch(100% 0 0); --card-foreground: oklch(14.5% 0 0);
    --primary: oklch(52% .14 160); --primary-foreground: oklch(98.5% 0 0);
    --muted: oklch(97% 0 0); --muted-foreground: oklch(55.6% 0 0);
    --accent: oklch(97% 0 0); --border: oklch(92.2% 0 0);
    --destructive: oklch(57.7% .245 27.325); --ring: oklch(62% .14 160 / .6);
    --radius: .625rem;
  }
  [data-theme="dark"]{
    --background: oklch(14.5% 0 0); --foreground: oklch(98.5% 0 0);
    --card: oklch(20.5% 0 0); --card-foreground: oklch(98.5% 0 0);
    --primary: oklch(62% .14 160); --primary-foreground: oklch(15% 0 0);
    --muted: oklch(26.9% 0 0); --muted-foreground: oklch(70.8% 0 0);
    --accent: oklch(26.9% 0 0); --border: oklch(100% 0 0/.1);
    --destructive: oklch(70.4% .191 22.216); --ring: oklch(65% .14 160);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:"Inter Variable","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:var(--foreground);background:var(--background);transition:background-color .25s,color .25s}
  .box{width:min(92vw,460px);text-align:center;background:var(--card);border:1px solid var(--border);
    border-radius:calc(var(--radius)*1.6);padding:28px 26px 24px;color:var(--card-foreground);
    box-shadow:0 24px 70px rgb(0 0 0/.12)}
  .logo{width:80px;height:80px;margin:0 auto 12px;border-radius:20px;display:block;image-rendering:pixelated;
    background:var(--muted)}
  .sname{margin:0;font-size:24px;font-weight:800;color:var(--primary)}
  .sub{margin:5px 0 0;font-size:12.5px;color:var(--muted-foreground)}
  .rule{height:1px;margin:18px 0;background:linear-gradient(90deg,transparent,var(--border),transparent)}
  h1{margin:0 0 4px;font-size:17px;color:var(--foreground)}
  .lead{margin:0 0 14px;font-size:12.5px;color:var(--muted-foreground);line-height:1.7}
  .req{margin:0 0 14px;padding:10px;border-radius:12px;background:color-mix(in oklab,var(--primary) 12%,transparent);
    border:1px solid var(--ring);font-size:19px;font-weight:800;color:var(--primary);word-break:break-all}
  .row{display:flex;gap:8px;margin-bottom:10px}
  input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--muted);color:var(--foreground);outline:none;font-size:14px;font-family:inherit}
  input:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--ring)}
  input.otp{letter-spacing:6px;text-align:center;font-size:17px;font-weight:800}
  button{padding:11px 14px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-foreground);
    font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
  button:hover{opacity:.9}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.wide{width:100%;margin-top:4px;font-size:15px;padding:13px}
  button.ghost{background:var(--muted);color:var(--foreground);border:1px solid var(--border)}
  .list{margin:12px 0;display:grid;gap:8px;text-align:left}
  .item{padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--muted);cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center;color:var(--foreground)}
  .item:hover{border-color:var(--ring)}
  .item.on{border-color:var(--ring);background:color-mix(in oklab,var(--primary) 12%,transparent)}
  .item small{color:var(--muted-foreground);font-size:11px}
  .msg{min-height:18px;margin:10px 0 0;font-size:12.5px;color:var(--muted-foreground);line-height:1.6}
  .msg.err{color:var(--destructive);font-weight:700}
  .foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground);line-height:1.9}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="box">
  <img class="logo" id="logo" src="assets/icon.png" alt="服务器 Logo">
  <h2 class="sname" id="sname">Stone Logic</h2>
  <p class="sub" id="sub">Minecraft 服务器 · 账号登录</p>
  <div class="rule"></div>

  <h1>账号登录</h1>
  <p class="lead">输入绑定的 QQ 号，验证码将发送到该 QQ 私聊<br>本站不收集、也无法验证 QQ 密码</p>

  <div id="loginBox">
    <div class="row"><input id="qq" type="text" inputmode="numeric" placeholder="QQ 号" maxlength="14">
      <button id="sendBtn" type="button">获取验证码</button></div>
    <div class="row"><input id="otp" class="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
      <button id="loginBtn" type="button">登录</button></div>
  </div>

  <div id="authBox" hidden>
    <div id="reqWrap">
      <p class="lead" style="margin-bottom:6px">本次授权请求的游戏 ID</p>
      <div class="req" id="reqName">核验中…</div>
    </div>
    <p class="lead" style="margin-bottom:6px">该 QQ 已绑定的游戏账号（点击选择）</p>
    <div class="list" id="accList"></div>
    <button class="wide" id="authBtn" type="button" disabled>授权登录</button>
  </div>

  <p class="msg" id="msg"></p>
  <div class="foot">
    还没有绑定？到 <a href="https://qm.qq.com/q/UhSK4yuLGG" target="_blank" rel="noopener">QQ 群</a> 绑定<br>
    <a href="index.html">← 返回服务器官网</a>
  </div>
</div>
<script>
(function () {
  try {
    var saved = localStorage.getItem('stl_theme');
    if (!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
  try {
    var cfg = JSON.parse(localStorage.getItem('mc-site-config-v2') || '{}');
    if (cfg.serverName) document.getElementById('sname').textContent = cfg.serverName;
    if (cfg.subtitle) document.getElementById('sub').textContent = cfg.subtitle;
    if (cfg.icon) document.getElementById('logo').src = cfg.icon;
  } catch (e) {}

  var q = new URLSearchParams(location.search);
  var code = q.get('c') || '';
  var topic = q.get('topic') || 'stl-ql-6bd1ae0f4e7e7968';
  var rid = sessionStorage.getItem('stl_site_rid');
  if (!rid) { rid = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); sessionStorage.setItem('stl_site_rid', rid); }
  var ntfy = topic ? 'https://ntfy.sh/' + encodeURIComponent(topic) : '';
  var reqName = '', chosen = '', logged = false;
  var SKEY = 'stl_web_session_v1';
  var pses = null, token = '', myNames = [];
  try { pses = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (!(pses && pses.token && pses.qq && pses.exp > Date.now())) pses = null; } catch (e) {}
  if (pses) { logged = true; token = pses.token || ''; myNames = pses.names || []; document.getElementById('loginBox').hidden = true; }
  var msg = document.getElementById('msg');
  var authBox = document.getElementById('authBox');
  var authBtn = document.getElementById('authBtn');
  var accList = document.getElementById('accList');

  function say(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }
  function post(obj) {
    if (!ntfy) { say('缺少授权参数，请回游戏重新获取链接。', true); return; }
    fetch(ntfy, { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify(obj) }).catch(function (e) { say('网络错误：' + e.message, true); });
  }
  function failAndGoHome(reason) {
    var left = 10;
    say('授权失败：' + reason + '。' + left + ' 秒后自动返回首页…', true);
    var t = setInterval(function () {
      left--;
      if (left <= 0) { clearInterval(t); location.href = 'index.html'; return; }
      say('授权失败：' + reason + '。' + left + ' 秒后自动返回首页…', true);
    }, 1000);
  }

  if (!code) {
    // 从官网「账号登录」入口进入：只登录并查看绑定账号，不做授权
    document.getElementById('reqWrap').hidden = true;
    authBtn.hidden = true;
    if (pses) { authBox.hidden = false; renderList(myNames); say('已登录（QQ ' + pses.qq + '），以下是你绑定的游戏账号'); }
    else say('登录后即可查看该 QQ 绑定的所有游戏账号');
  }

  var es = new EventSource(ntfy + '/sse');
  es.onmessage = function (ev) {
    var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.event !== 'message' || !d.message) return;
    var m; try { m = JSON.parse(d.message); } catch (e) { return; }
    if (m.rid && m.rid !== rid) return;

    if (m.type === 'probeAck') {
      if (m.code !== code) return;
      if (!m.valid) { authBox.hidden = true; say('链接已使用或已过期，请回游戏重新获取。', true); return; }
      reqName = m.name;
      document.getElementById('reqName').textContent = m.name;
      authBox.hidden = false;
      if (pses) {
        renderList(myNames);
        var hit = myNames.indexOf(m.name) >= 0;
        chosen = hit ? m.name : '';
        authBtn.disabled = !hit;
        if (hit) say('已自动匹配你的账号，点击「授权登录」即可直接授权');
        else say('本次请求的账号「' + m.name + '」不在你绑定的账号列表中', true);
      } else {
        say('请登录并选择一个游戏账号');
      }
      return;
    }
    if (m.type === 'loginSent') { say(m.ok ? '验证码已发送到 QQ 私聊，请注意查收' : '该 QQ 没有绑定任何游戏账号', !m.ok); return; }
    if (m.type === 'loginFail') { say('登录失败：' + m.reason, true); return; }
    if (m.type === 'loginOk') {
      logged = true;
      document.getElementById('loginBox').hidden = true;
      authBox.hidden = false;
      renderList(m.names || []);
      try { localStorage.setItem(SKEY, JSON.stringify({ token: m.token, qq: m.qq, names: m.names || [], exp: Date.now() + 7 * 86400000 })); } catch (e) {}
      say('登录成功（QQ ' + m.qq + '），请选择账号授权');
      return;
    }
    if (m.type === 'authOk') { say('授权成功！请回到游戏，弹窗会自动关闭并进入服务器。'); authBtn.disabled = true; return; }
    if (m.type === 'authFail') { if (m.code === code) failAndGoHome(m.reason); }
  };

  function renderList(names) {
    accList.innerHTML = '';
    if (!names.length) { accList.innerHTML = '<div class="item"><span>该 QQ 未绑定游戏账号</span></div>'; return; }
    names.forEach(function (n) {
      var el = document.createElement('div');
      el.className = 'item' + (n === reqName ? ' on' : '');
      el.innerHTML = '<span>' + n + '</span><small>' + (n === reqName ? '本次请求' : '已绑定') + '</small>';
      if (n === reqName) chosen = n;
      el.addEventListener('click', function () {
        chosen = n;
        Array.prototype.forEach.call(accList.children, function (c) { c.classList.remove('on'); });
        el.classList.add('on');
        authBtn.disabled = !logged;
      });
      accList.appendChild(el);
    });
    authBtn.disabled = !logged || !chosen;
  }

  document.getElementById('sendBtn').addEventListener('click', function () {
    var qq = (document.getElementById('qq').value || '').replace(/\D/g, '');
    if (qq.length < 5) { say('请输入正确的 QQ 号', true); return; }
    say('正在发送验证码…');
    post({ type: 'loginSend', qq: qq, rid: rid });
  });
  document.getElementById('loginBtn').addEventListener('click', function () {
    var qq = (document.getElementById('qq').value || '').replace(/\D/g, '');
    var otp = (document.getElementById('otp').value || '').replace(/\D/g, '');
    if (qq.length < 5 || otp.length !== 6) { say('请填写 QQ 号和 6 位验证码', true); return; }
    say('正在登录…');
    post({ type: 'loginCheck', qq: qq, otp: otp, rid: rid });
  });
  authBtn.addEventListener('click', function () {
    if (!logged || !chosen) { say('请先登录并选择账号', true); return; }
    if (chosen !== reqName) { failAndGoHome('所选账号与本次登录请求不一致'); return; }
    say('正在授权…');
    post({ type: 'authReq', code: code, rid: rid, name: chosen, token: token });
  });

  // 有授权请求时才核验链接
  if (code) {
    var tries = 0;
    function probe() { post({ probe: code, rid: rid }); }
    probe();
    var timer = setInterval(function () { if (tries++ > 6 || reqName) { clearInterval(timer); return; } probe(); }, 2000);
    setTimeout(function () { if (!reqName) say('核验链接超时，请回游戏重新获取。', true); }, 18000);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号登录 · Stone Logic</title>
<style>
  /* 与官网主站一致：服务器名称用方块像素字体 */
  @font-face{
    font-family:"StlPixel";
    src:url("assets/fonts/silkscreen-700.woff2") format("woff2");
    font-weight:700;font-style:normal;font-display:swap;
  }
  .stl-pixel{
    font-family:"StlPixel","Silkscreen","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  }
  :root{
    --background: oklch(100% 0 0); --foreground: oklch(14.5% 0 0);
    --card: oklch(100% 0 0); --card-foreground: oklch(14.5% 0 0);
    --primary: oklch(64% .125 238); --primary-foreground: oklch(98.5% 0 0);
    --muted: oklch(97% 0 0); --muted-foreground: oklch(55.6% 0 0);
    --accent: oklch(97% 0 0); --border: oklch(92.2% 0 0);
    --destructive: oklch(57.7% .245 27.325); --ring: oklch(62% .14 160 / .6);
    --radius: .625rem;
  }
  [data-theme="dark"]{
    --background: oklch(14.5% 0 0); --foreground: oklch(98.5% 0 0);
    --card: oklch(20.5% 0 0); --card-foreground: oklch(98.5% 0 0);
    --primary: oklch(72% .12 238); --primary-foreground: oklch(15% 0 0);
    --muted: oklch(26.9% 0 0); --muted-foreground: oklch(70.8% 0 0);
    --accent: oklch(26.9% 0 0); --border: oklch(100% 0 0/.1);
    --destructive: oklch(70.4% .191 22.216); --ring: oklch(72% .12 238);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:"Inter Variable","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:var(--foreground);background:var(--background);transition:background-color .25s,color .25s}
  .box{width:min(92vw,460px);text-align:center;background:var(--card);border:1px solid var(--border);
    border-radius:calc(var(--radius)*1.6);padding:28px 26px 24px;color:var(--card-foreground);
    box-shadow:0 24px 70px rgb(0 0 0/.12)}
  .logo{width:80px;height:80px;margin:0 auto 12px;border-radius:20px;display:block;image-rendering:pixelated;
    background:var(--muted)}
  .sname{margin:0;font-size:24px;font-weight:700;color:var(--primary)}
  .sub{margin:5px 0 0;font-size:12.5px;color:var(--muted-foreground)}
  .rule{height:1px;margin:18px 0;background:linear-gradient(90deg,transparent,var(--border),transparent)}
  h1{margin:0 0 4px;font-size:17px;color:var(--foreground)}
  .lead{margin:0 0 14px;font-size:12.5px;color:var(--muted-foreground);line-height:1.7}
  .req{margin:0 0 14px;padding:10px;border-radius:12px;background:color-mix(in oklab,var(--primary) 12%,transparent);
    border:1px solid var(--ring);font-size:19px;font-weight:800;color:var(--primary);word-break:break-all}
  .row{display:flex;gap:8px;margin-bottom:10px}
  input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--muted);color:var(--foreground);outline:none;font-size:14px;font-family:inherit}
  input:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--ring)}
  input.otp{letter-spacing:6px;text-align:center;font-size:17px;font-weight:800}
  button{padding:11px 14px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-foreground);
    font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
  button:hover{opacity:.9}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.wide{width:100%;margin-top:4px;font-size:15px;padding:13px}
  button.ghost{background:var(--muted);color:var(--foreground);border:1px solid var(--border)}
  .list{margin:12px 0;display:grid;gap:8px;text-align:left}
  .item{padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--muted);cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center;color:var(--foreground)}
  .item:hover{border-color:var(--ring)}
  .item.on{border-color:var(--ring);background:color-mix(in oklab,var(--primary) 12%,transparent)}
  .item small{color:var(--muted-foreground);font-size:11px}
  .msg{min-height:18px;margin:10px 0 0;font-size:12.5px;color:var(--muted-foreground);line-height:1.6}
  .msg.err{color:var(--destructive);font-weight:700}
  .foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground);line-height:1.9}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  [hidden]{display:none!important}
  .scan-entry{text-align:center;margin:2px 0 6px}
  .scan-link{border:0;background:transparent;color:var(--primary);font-size:13px;cursor:pointer;padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
  .scan-link:hover{opacity:.75}
  .scan-panel{text-align:center;padding:14px 0 6px}
  .scan-panel canvas{display:block;margin:0 auto;width:220px;height:220px;background:#fff;border-radius:12px;
    border:1px solid var(--border);padding:8px;box-sizing:border-box;image-rendering:pixelated}
  .scan-hint{font-size:12.5px;color:var(--muted-foreground);line-height:1.7;margin:12px 0 2px}
</style>
</head>
<body>
<div class="box">
  <img class="logo" id="logo" src="assets/icon.png" alt="服务器 Logo">
  <h2 class="sname stl-pixel" id="sname">Stone Logic</h2>
  <p class="sub" id="sub">Minecraft 服务器 · 账号登录</p>
  <div class="rule"></div>

  <h1 id="pageTitle">账号登录</h1>
  <p class="lead" id="pageLead">输入绑定的 QQ 号，验证码将发送到该 QQ 私聊<br>本站不收集、也无法验证 QQ 密码</p>

  <div id="loginBox">
    <div class="row"><input id="qq" type="text" inputmode="numeric" placeholder="QQ 号" maxlength="14">
      <button id="sendBtn" type="button">获取验证码</button></div>
    <div class="row"><input id="otp" class="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
      <button id="loginBtn" type="button">登录</button></div>
  </div>

  <div id="scanEntry" hidden>
    <button id="scanBtn" type="button" class="scan-link">📱 改用扫码登录</button>
  </div>

  <div id="scanPanel" class="scan-panel" hidden>
    <canvas id="scanQr" width="220" height="220" aria-label="登录二维码"></canvas>
    <p id="scanHint" class="scan-hint">正在生成二维码…</p>
    <button id="scanCancel" type="button" class="scan-link">← 返回验证码登录</button>
  </div>

  <div id="authBox" hidden>
    <div id="reqWrap">
      <p class="lead" style="margin-bottom:6px">本次授权请求的游戏 ID</p>
      <div class="req" id="reqName">核验中…</div>
    </div>
    <p class="lead" style="margin-top:12px">验证通过后会自动完成授权并返回首页，无需操作</p>
  </div>

  <p class="msg" id="msg"></p>
  <div class="foot">
    还没有绑定？到 <a href="https://qm.qq.com/q/UhSK4yuLGG" target="_blank" rel="noopener">QQ 群</a> 绑定<br>
    <a href="index.html">← 返回服务器官网</a>
  </div>
</div>
<script src="assets/qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  try {
    var saved = localStorage.getItem('stl_theme');
    if (!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
  try {
    var cfg = JSON.parse(localStorage.getItem('mc-site-config-v2') || '{}');
    if (cfg.serverName) document.getElementById('sname').textContent = cfg.serverName;
    if (cfg.subtitle) document.getElementById('sub').textContent = cfg.subtitle;
    if (cfg.icon) document.getElementById('logo').src = cfg.icon;
  } catch (e) {}

  var q = new URLSearchParams(location.search);
  var code = q.get('c') || '';
  var lt = q.get('lt') || '';          // 一次性登录票（游戏内链接自带，用来免验证码登录）
  var topic = q.get('topic') || 'stl-ql-6bd1ae0f4e7e7968';
  // 服务端拿不到个人授权码时的兜底入口（多半是该游戏ID还没绑定 QQ）
  var isFallback = q.get('fallback') === '1';
  var fbName = q.get('player') || '';
  // 手机扫码后若本机没登录，会先跳来这里用验证码登录；登完自动回扫码确认页
  var scanBack = q.get('scan') || '';
  var rid = sessionStorage.getItem('stl_site_rid');
  if (!rid) { rid = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); sessionStorage.setItem('stl_site_rid', rid); }
  var ntfy = topic ? 'https://ntfy.sh/' + encodeURIComponent(topic) : '';
  var reqName = '', logged = false, authing = false;
  var SKEY = 'stl_web_session_v1';
  var pses = null, token = '', myNames = [];
  try { pses = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (!(pses && pses.token && pses.qq && pses.exp > Date.now())) pses = null; } catch (e) {}
  if (pses) { logged = true; token = pses.token || ''; myNames = pses.names || []; document.getElementById('loginBox').hidden = true; }
  // 带着票据来（游戏内链接）就别先闪一下登录框，等 onopen 后直接换登录态
  else if (lt) { document.getElementById('loginBox').hidden = true; }
  var msg = document.getElementById('msg');
  var authBox = document.getElementById('authBox');

  function say(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }
  function post(obj) {
    if (!ntfy) { say('缺少授权参数，请回游戏重新获取链接。', true); return; }
    /* 带上 UA：服务端记进登录凭证，方便「登录设备管理」区分是哪台设备 */
    if (obj && !obj.ua) { try { obj.ua = navigator.userAgent; } catch (e) {} }
    fetch(ntfy, { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify(obj) }).catch(function (e) { say('网络错误：' + e.message, true); });
  }

  /* 登录成功后统一落盘：有效期按服务端给的 days（默认 30 天） */
  function saveSession(m) {
    logged = true;
    token = m.token || '';
    myNames = m.names || [];
    var days = Number(m.days) > 0 ? Number(m.days) : 30;
    try {
      localStorage.setItem(SKEY, JSON.stringify({
        token: token, qq: m.qq, uid: m.uid || '', names: myNames, exp: Date.now() + days * 86400000
      }));
    } catch (e) {}
    var lb = document.getElementById('loginBox');
    if (lb) lb.hidden = true;
  }

  var ticketTried = false;
  /* 游戏内链接自带一次性票：直接换登录态，绑过 QQ 的玩家不用再收验证码 */
  function tryTicketLogin() {
    if (!lt || ticketTried) return false;
    ticketTried = true;
    var lb = document.getElementById('loginBox');
    if (lb) lb.hidden = true;
    var t1 = document.getElementById('pageTitle'), l1 = document.getElementById('pageLead');
    if (t1) t1.textContent = '正在自动登录';
    if (l1) l1.textContent = '本次登录由游戏内链接自动完成，无需输入验证码';
    say('正在自动登录…');
    post({ type: 'ticketLogin', ticket: lt, rid: rid });
    return true;
  }

  /* ---------- 扫码登录（电脑端） ----------
     二维码里只有一个随机 sid；服务端在手机确认后把新签发的 token 走 SSE 推回来。 */
  var scanEntry = document.getElementById('scanEntry');
  var scanPanel = document.getElementById('scanPanel');
  var scanHint = document.getElementById('scanHint');
  var scanCancel = document.getElementById('scanCancel');
  var scanSid = '', scanDeadline = 0, scanCountdown = null, scanWait = null;

  function drawQr(text) {
    var cv = document.getElementById('scanQr');
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount(), quiet = 3, total = n + quiet * 2;
    var px = Math.max(2, Math.floor(440 / total));
    var size = px * total;
    cv.width = size; cv.height = size;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#0f2233';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * px, (r + quiet) * px, px, px);
      }
    }
  }

  function stopScan(reason) {
    if (scanCountdown) { clearInterval(scanCountdown); scanCountdown = null; }
    if (scanWait) { clearTimeout(scanWait); scanWait = null; }
    if (scanSid) { post({ type: 'scanCancel', sid: scanSid, rid: rid }); scanSid = ''; }
    scanDeadline = 0;
    scanPanel.hidden = true;
    scanEntry.hidden = false;
    if (reason) say(reason, true);
  }

  function startScan() {
    if (!ntfy) { say('缺少授权参数，无法扫码登录。', true); return; }
    if (scanSid) post({ type: 'scanCancel', sid: scanSid, rid: rid });
    scanEntry.hidden = true;
    scanPanel.hidden = false;
    scanDeadline = 0;
    scanHint.textContent = '正在生成二维码…';
    scanCancel.textContent = '← 返回验证码登录';
    var b = crypto.getRandomValues(new Uint8Array(16));
    scanSid = Array.from(b).map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    // 服务端没重启时不能一直卡着；8 秒没拿到二维码就明确告诉用户改用验证码
    if (scanWait) clearTimeout(scanWait);
    var waitingFor = scanSid;
    scanWait = setTimeout(function () {
      if (scanSid !== waitingFor || scanDeadline) return;   // 已经出码了
      scanHint.innerHTML = '没收到服务端响应，授权服务可能还没重启。<br>请先用验证码登录，或稍后再试。';
      scanCancel.textContent = '← 返回验证码登录';
    }, 8000);
    post({ type: 'scanCreate', sid: scanSid, rid: rid });
  }

  function onScanReady(m) {
    if (m.sid !== scanSid) return;
    if (scanWait) { clearTimeout(scanWait); scanWait = null; }
    try { drawQr(m.url); } catch (e) { stopScan('二维码生成失败，请用验证码登录。'); return; }
    scanDeadline = Date.now() + (Number(m.seconds) || 180) * 1000;
    if (scanCountdown) clearInterval(scanCountdown);
    function tick() {
      var left = Math.max(0, Math.ceil((scanDeadline - Date.now()) / 1000));
      if (!left) {
        scanHint.innerHTML = '二维码已过期，点下方按钮刷新';
        scanCancel.textContent = '刷新二维码';
        if (scanCountdown) { clearInterval(scanCountdown); scanCountdown = null; }
        return;
      }
      scanHint.innerHTML = '用手机扫码 → 在手机上点「确认登录」<br>二维码 ' + left + ' 秒内有效';
    }
    tick();
    scanCountdown = setInterval(tick, 1000);
  }

  function onScanOk(m) {
    if (m.sid && m.sid !== scanSid) return;
    if (scanWait) { clearTimeout(scanWait); scanWait = null; }
    scanSid = ''; scanDeadline = 0;
    if (scanCountdown) { clearInterval(scanCountdown); scanCountdown = null; }
    scanPanel.hidden = true;
    scanEntry.hidden = true;
    saveSession(m);
    if (code) { say('扫码登录成功（QQ ' + m.qq + '），正在授权…'); tryAutoAuth(); return; }
    countdownHome('扫码登录成功（QQ ' + m.qq + '）', 5);
  }

  document.getElementById('scanBtn').addEventListener('click', startScan);
  scanCancel.addEventListener('click', function () {
    if (scanDeadline && Date.now() >= scanDeadline) startScan();
    else stopScan('');
  });
  // 只有从官网「账号登录」入口进来（没有授权码、没有票、也没登录）才显示扫码入口
  if (!pses && !scanBack && !lt && !code) scanEntry.hidden = false;

  /* 票不可用时恢复成手动登录的样子 */
  function showLoginBox(reason) {
    var lb = document.getElementById('loginBox');
    if (lb) lb.hidden = false;
    var t1 = document.getElementById('pageTitle'), l1 = document.getElementById('pageLead');
    if (t1) t1.textContent = '账号登录';
    if (l1) l1.innerHTML = '输入绑定的 QQ 号，验证码将发送到该 QQ 私聊<br>本站不收集、也无法验证 QQ 密码';
    if (reason) say(reason, true);
  }

  /* 办完事就倒计时回首页，不再停在中间页 */
  function countdownHome(prefix, secs) {
    var left = secs || 5;
    say(prefix + '，' + left + ' 秒后返回首页…');
    var t = setInterval(function () {
      left--;
      if (left <= 0) { clearInterval(t); location.href = 'index.html'; return; }
      say(prefix + '，' + left + ' 秒后返回首页…');
    }, 1000);
  }
  function failAndGoHome(reason) { countdownHome('授权失败：' + reason, 5); }

  /* 登录态 + 请求账号都齐了就自动授权，取代原来「点选账号再点授权」的两步 */
  function tryAutoAuth() {
    if (!code || !logged || !token || !reqName || authing) return;
    if (myNames.indexOf(reqName) < 0) {
      say('本次请求的账号「' + reqName + '」不在这个 QQ 绑定的账号里，请回游戏重新获取链接。', true);
      return;
    }
    authing = true;
    say('正在为「' + reqName + '」授权…');
    post({ type: 'authReq', code: code, rid: rid, name: reqName, token: token });
  }

  if (!code) {
    // 从官网「账号登录」入口进入：只登录，不显示任何授权/选号界面，登完直接回首页
    authBox.hidden = true;
    if (isFallback) {
      say('游戏账号「' + fbName + '」还没有绑定 QQ。请先在 QQ 群发送「登录 ' + fbName + '」完成绑定，再回游戏重新进入即可。', true);
    } else if (scanBack) {
      say('登录后会自动回到扫码确认页');
    } else if (pses) countdownHome('已登录（QQ ' + pses.qq + '）', 5);
    else say('登录后会直接返回首页');
  }

  /* since=30s 让订阅补发半分钟内的缓存消息：避免服务端回包比 SSE 建连更快时被丢掉 */
  var es = new EventSource(ntfy + '/sse?since=30s');
  es.onopen = function () {
    // 游戏内授权链接：本地没有登录态、但链接里有票 → 等通道通了再换登录态，否则回包会丢
    if (code && !pses) tryTicketLogin();
  };
  es.onmessage = function (ev) {
    var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.event !== 'message' || !d.message) return;
    var m; try { m = JSON.parse(d.message); } catch (e) { return; }
    if (m.rid && m.rid !== rid) return;

    if (m.type === 'probeAck') {
      if (m.code !== code) return;
      if (!m.valid) { authBox.hidden = true; say('链接已使用或已过期，请回游戏重新获取。', true); return; }
      reqName = m.name;
      document.getElementById('reqName').textContent = m.name;
      authBox.hidden = false;
      if (!logged) { say('请用绑定的 QQ 登录，验证通过后自动授权'); return; }
      tryAutoAuth();
      return;
    }
    if (m.type === 'loginSent') {
      if (!m.ok) { say('该 QQ 没有绑定任何游戏账号', true); return; }
      if (m.delivered === false) {
        say('验证码发不进你的 QQ。请到 QQ 群里点机器人头像发任意一条消息，我会立刻把验证码补发给你。', true);
        return;
      }
      say('验证码已发送到 QQ 私聊，请注意查收');
      return;
    }
    if (m.type === 'loginFail') { say('登录失败：' + m.reason, true); return; }
    // 扫码登录：二维码已生成 / 手机确认完毕
    if (m.type === 'scanReady') { onScanReady(m); return; }
    if (m.type === 'scanOk') { onScanOk(m); return; }
    if (m.type === 'loginOk') {
      saveSession(m);   // 关键修复：刷新内存与本地缓存中的令牌，否则会带空令牌被判「未登录」
      // 手机扫码流程：这台设备刚用验证码登录完，回扫码确认页继续
      if (scanBack) { location.href = 'scan.html?sid=' + encodeURIComponent(scanBack); return; }
      // 游戏内的授权请求：不展示选号页，直接自动授权
      if (code) { say('登录成功（QQ ' + m.qq + '），正在验证…'); tryAutoAuth(); return; }
      // 官网登录入口：登录完就回首页
      countdownHome('登录成功（QQ ' + m.qq + '）', 5);
      return;
    }
    // 免登录票据换登录态成功：绑过 QQ 的玩家直接就是已登录
    if (m.type === 'ticketOk') {
      saveSession(m);
      if (scanBack) { location.href = 'scan.html?sid=' + encodeURIComponent(scanBack); return; }
      say('已自动登录（QQ ' + m.qq + '），正在验证…');
      var pb = document.getElementById('pageTitle'), pl = document.getElementById('pageLead');
      if (pb) pb.textContent = '已自动登录';
      if (pl) pl.textContent = '绑定 QQ 后无需再输入验证码，正在完成授权…';
      if (code) { tryAutoAuth(); return; }
      countdownHome('已登录（QQ ' + m.qq + '）', 5);
      return;
    }
    if (m.type === 'ticketFail') {
      showLoginBox('自动登录没成功：' + m.reason + '。请在下面用 QQ + 验证码登录');
      return;
    }
    if (m.type === 'authOk') { countdownHome('授权成功，回到游戏即可进入服务器', 5); return; }
    if (m.type === 'authFail') {
      if (m.code === code) {
        // 令牌失效 / 登录过期属于可恢复：展示登录框让用户重新登录刷新令牌，而不是倒计时踢回首页
        if (/未登录|登录.*过期|过期/.test(m.reason || '')) {
          logged = false; authing = false; token = ''; pses = null;
          try { localStorage.removeItem(SKEY); } catch (e) {}   // 关键：本地缓存也要清掉，否则刷新后又会带着失效令牌重试
          document.getElementById('loginBox').hidden = false;
          say('授权失败：' + m.reason + '。请在上方用 QQ + 验证码重新登录（会刷新授权令牌），或在游戏内重新获取登录链接后再试。', true);
        } else {
          failAndGoHome(m.reason);
        }
      }
      return;
    }
  };

  document.getElementById('sendBtn').addEventListener('click', function () {
    var qq = (document.getElementById('qq').value || '').replace(/\D/g, '');
    if (qq.length < 5) { say('请输入正确的 QQ 号', true); return; }
    say('正在发送验证码…');
    post({ type: 'loginSend', qq: qq, rid: rid });
  });
  document.getElementById('loginBtn').addEventListener('click', function () {
    var qq = (document.getElementById('qq').value || '').replace(/\D/g, '');
    var otp = (document.getElementById('otp').value || '').replace(/\D/g, '');
    if (qq.length < 5 || otp.length !== 6) { say('请填写 QQ 号和 6 位验证码', true); return; }
    say('正在登录…');
    post({ type: 'loginCheck', qq: qq, otp: otp, rid: rid });
  });

  // 有授权请求时才核验链接
  if (code) {
    var tries = 0;
    function probe() { post({ probe: code, rid: rid }); }
    probe();
    var timer = setInterval(function () { if (tries++ > 6 || reqName) { clearInterval(timer); return; } probe(); }, 2000);
    setTimeout(function () { if (!reqName) say('核验链接超时，请回游戏重新获取。', true); }, 18000);
  }
})();
</script>
</body>
</html>

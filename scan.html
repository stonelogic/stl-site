<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扫码登录 · Stone Logic</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root{
    --background: oklch(100% 0 0); --foreground: oklch(14.5% 0 0);
    --card: oklch(100% 0 0); --primary: oklch(64% .125 238);
    --muted: oklch(97% 0 0); --muted-foreground: oklch(55.6% 0 0);
    --border: oklch(92.2% 0 0); --destructive: oklch(57.7% .245 27.325);
  }
  [data-theme="dark"]{
    --background: oklch(16% 0 0); --foreground: oklch(96% 0 0);
    --card: oklch(21% 0 0); --muted: oklch(26% 0 0);
    --muted-foreground: oklch(68% 0 0); --border: oklch(31% 0 0);
  }
  @font-face{
    font-family:"StlPixel";
    src:url("assets/fonts/silkscreen-700.woff2") format("woff2");
    font-weight:700;font-style:normal;font-display:swap;
  }
  .stl-pixel{
    font-family:"StlPixel","Silkscreen","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--background);color:var(--foreground);
    font:15px/1.6 "PingFang SC","Microsoft YaHei",Arial,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
  .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 8px 32px rgb(0 0 0/.06)}
  .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 12px}
  .sname{margin:0;font-size:20px;color:var(--primary)}
  .sub{margin:4px 0 0;font-size:12.5px;color:var(--muted-foreground)}
  .rule{height:1px;background:var(--border);margin:18px 0}
  h1{font-size:19px;margin:0 0 6px}
  .lead{font-size:13px;color:var(--muted-foreground);margin:0 0 16px;line-height:1.7}
  .state{padding:20px 12px;border-radius:12px;background:var(--muted);margin-bottom:16px}
  .state .ico{font-size:30px;line-height:1;margin-bottom:10px}
  .state .big{font-size:15px;font-weight:700;margin-bottom:4px}
  .state .small{font-size:12.5px;color:var(--muted-foreground)}
  .who{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
  .who span{font-size:12px;background:color-mix(in oklab,var(--primary) 12%,transparent);
    color:var(--primary);border-radius:999px;padding:3px 9px}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:12px 16px;
    font-size:15px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--border);font-weight:600}
  .msg{min-height:18px;font-size:12.5px;color:var(--muted-foreground);margin:12px 0 0;line-height:1.6}
  .msg.err{color:var(--destructive);font-weight:700}
  .msg.ok{color:oklch(50% .14 150);font-weight:700}
  .foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}
  a{color:var(--primary);text-decoration:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="assets/icon.png" alt="logo">
  <h2 class="sname stl-pixel">Stone Logic</h2>
  <p class="sub">Minecraft 服务器 · 扫码登录</p>
  <div class="rule"></div>

  <h1>确认登录电脑端</h1>
  <p class="lead">这是你用手机扫开的确认页<br>确认后，电脑上的网页会自动登录</p>

  <div class="state" id="state">
    <div class="ico">⏳</div>
    <div class="big">正在检查二维码…</div>
    <div class="small">请稍候</div>
  </div>

  <button class="btn" id="confirmBtn" type="button" hidden>确认登录</button>
  <button class="btn" id="loginBtn" type="button" hidden>先在这台手机上登录</button>
  <button class="btn ghost" id="againBtn" type="button" hidden>重新检查</button>

  <p class="msg" id="msg"></p>
  <div class="foot">
    不是你本人扫的？直接关掉这个页面即可，不会有任何影响。<br>
    <a href="index.html">← 返回服务器官网</a>
  </div>
</div>

<script>
(function () {
  'use strict';
  try {
    var saved = localStorage.getItem('stl_theme');
    if (!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}

  var q = new URLSearchParams(location.search);
  var sid = q.get('sid') || '';
  var topic = q.get('topic') || 'stl-ql-6bd1ae0f4e7e7968';
  var ntfy = topic ? 'https://ntfy.sh/' + encodeURIComponent(topic) : '';
  var SKEY = 'stl_web_session_v1';
  var rid = Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');

  var state = document.getElementById('state');
  var msg = document.getElementById('msg');
  var confirmBtn = document.getElementById('confirmBtn');
  var loginBtn = document.getElementById('loginBtn');
  var againBtn = document.getElementById('againBtn');
  var confirmed = false;

  function say(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }
  function setState(ico, big, small) {
    state.innerHTML = '<div class="ico">' + ico + '</div><div class="big">' + big +
                      '</div><div class="small">' + small + '</div>';
  }
  function post(obj) {
    if (!ntfy) { say('缺少消息通道参数，请重新扫码。', 'err'); return; }
    /* 带上 UA：扫码确认登录时，服务端会把设备信息记进新签发的凭证 */
    if (obj && !obj.ua) { try { obj.ua = navigator.userAgent; } catch (e) {} }
    fetch(ntfy, { method: 'POST', headers: { 'content-type': 'text/plain' },
                  body: JSON.stringify(obj) }).catch(function (e) { say('网络错误：' + e.message, 'err'); });
  }
  function session() {
    try {
      var s = JSON.parse(localStorage.getItem(SKEY) || 'null');
      if (s && s.token && s.qq && s.exp > Date.now()) return s;
    } catch (e) {}
    return null;
  }
  function hideAll() {
    confirmBtn.hidden = true; loginBtn.hidden = true; againBtn.hidden = true;
  }

  function showFor(s) {
    hideAll();
    if (s) {
      var names = Array.isArray(s.names) ? s.names : [];
      setState('📱', 'QQ ' + s.qq, '点下面按钮，授权电脑端登录');
      if (names.length) {
        var box = document.createElement('div');
        box.className = 'who';
        names.slice(0, 8).forEach(function (n) {
          var sp = document.createElement('span');
          sp.textContent = n;
          box.appendChild(sp);
        });
        state.appendChild(box);
      }
      confirmBtn.hidden = false;
    } else {
      setState('🔑', '这台手机还没登录', '第一次扫码需要先登录一次，之后 30 天内直接确认即可');
      loginBtn.hidden = false;
    }
  }

  function probe() { post({ type: 'scanProbe', sid: sid, rid: rid }); }

  confirmBtn.addEventListener('click', function () {
    var s = session();
    if (!s) { showFor(null); return; }
    if (confirmed) return;
    confirmed = true;
    confirmBtn.disabled = true;
    say('正在确认…');
    post({ type: 'scanConfirm', sid: sid, token: s.token, rid: rid });
  });
  loginBtn.addEventListener('click', function () {
    location.href = 'confirm.html?scan=' + encodeURIComponent(sid) + '&topic=' + encodeURIComponent(topic);
  });
  againBtn.addEventListener('click', function () { confirmed = false; hideAll(); setState('⏳', '正在重新检查…', '请稍候'); probe(); });

  var es = new EventSource(ntfy + '/sse?since=30s');
  es.onopen = function () { probe(); };
  es.onmessage = function (ev) {
    var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.event !== 'message' || !d.message) return;
    var m; try { m = JSON.parse(d.message); } catch (e) { return; }
    if (m.rid && m.rid !== rid) return;

    if (m.type === 'scanState') {
      if (m.sid !== sid) return;
      if (!m.valid) {
        hideAll();
        setState('⌛', '二维码已失效', '回电脑端点「刷新二维码」再扫一次');
        againBtn.hidden = false;
        say('这张码已经用掉或超过 3 分钟了。', 'err');
        return;
      }
      showFor(session());
      say('');
      return;
    }
    if (m.type === 'scanAck') {
      if (m.sid !== sid) return;
      confirmed = false;
      confirmBtn.disabled = false;
      hideAll();
      if (m.ok) {
        setState('✅', '已确认', '电脑端正在登录，现在可以关掉这个页面');
        say('登录成功（QQ ' + m.qq + '）', 'ok');
      } else {
        setState('⚠️', '没能确认', m.reason || '请重试');
        againBtn.hidden = false;
        say(m.reason || '请重试', 'err');
      }
      return;
    }
  };
  es.onerror = function () { say('连接中断，正在自动重连…'); };

  if (!sid) {
    setState('⚠️', '链接不完整', '请用手机重新扫描电脑上的二维码');
    say('缺少 sid 参数。', 'err');
  }
})();
</script>
</body>
</html>
